<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر M-Turbo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        header {
            background-color: #111;
            color: #fff;
            padding: 20px;
        }
        .offers-banner {
            background-color: #ff4757;
            color: white;
            padding: 10px;
            font-weight: bold;
        }
        .container {
            padding: 20px;
        }
        .products-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .product-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 200px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <header>
        <h1>متجر M-Turbo</h1>
    </header>

    <div class="offers-banner">
        🔥 عروض خاصة لفترة محدودة! خصومات تصل إلى 30% 🔥
    </div>

    <div class="container">
        <h2>المنتجات</h2>
        <div class="products-grid">
            <div class="product-card">
                <h3>منتج 1</h3>
                <p>وصف المنتج هنا</p>
                <span>السعر: $10</span>
            </div>
            <div class="product-card">
                <h3>منتج 2</h3>
                <p>وصف المنتج هنا</p>
                <span>السعر: $15</span>
            </div>
        </div>
    </div>

</body>
</html>
